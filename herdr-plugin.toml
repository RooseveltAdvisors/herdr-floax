# herdr-plugin.toml — manifest for herdr-floax.
#
# A floating scratch shell for the current workspace, modeled on tmux-floax
# (https://github.com/omerxx/tmux-floax). On herdr 0.7.5 the pane is a real
# herdr terminal (not a nested alt-screen TUI): the host owns scrollback, so
# herdr copy mode (prefix+j) and C-u/C-d half-page scroll work on floax history
# the same way they do on any other pane.
#
# Toggle is open → reveal → dismiss, one instance per workspace. The shell
# session persists across dismiss when dtach/abduco is available (see
# scripts/floating-shell.sh). The host pane is a split that the toggle script
# zooms for a full-workspace floating look. herdr's `overlay`/`zoomed`
# placements are transient from keybindings; `popup` is sized but is not a
# tiled pane, so copy mode does not target it — hence split-then-zoom.

id = "herdr-floax"
name = "herdr-floax"
version = "0.4.0"
description = "Toggle a floating scratch shell for the current workspace, à la tmux-floax."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

# No cargo build: the pane runs a shell script. (A previous nested-TUI binary
# lived under src/; it is no longer the pane command.)

# The floating pane: a real login shell (detach-wrapped when possible).
# `title` becomes the pane `label`, which toggle-floating.sh uses to find our
# pane within a workspace. Placement default is `split`; the toggle script
# always opens with split + zoom.
[[panes]]
id = "floating"
title = "⌂ floax"
placement = "split"
command = ["bash", "scripts/floating-shell.sh"]

# The action the keybinding invokes. herdr qualifies this as `herdr-floax.toggle`
# — that is the id the config.toml `[[keys.command]]` binding references.
[[actions]]
id = "toggle"
title = "Toggle floating pane"
description = "Open, reveal, or dismiss the floating scratch shell for this workspace."
command = ["bash", "scripts/toggle-floating.sh"]

[[actions]]
id = "toggle-cmd"
title = "Toggle quota in floating pane"
description = "Open, reveal, or dismiss the quota profile in the floating pane."
command = ["bash", "scripts/toggle-floating.sh", "quota"]
